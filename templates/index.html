<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chatbot-container">
        <!-- Header -->
        <div class="chatbot-header">
            <div class="header-content">
                <h1>ChatBot</h1>
                <p class="status">Online</p>
            </div>
            <button class="minimize-btn">−</button>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! 👋 Ask me anything and I'll look it up on Wikipedia!</p>
                </div>
                <span class="message-time">Just now</span>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput"
                    placeholder="Type your message here..."
                    autocomplete="off"
                >
                <button class="emoji-btn" title="Add emoji">😊</button>
            </div>
            <button class="send-btn" id="sendBtn" title="Send message">
                <span>Send</span>
            </button>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="quick-action-btn" onclick="sendQuickMessage('Hello')">Hello</button>
            <button class="quick-action-btn" onclick="sendQuickMessage('Help')">Help</button>
            <button class="quick-action-btn" onclick="sendQuickMessage('Python programming')">Python</button>
            <button class="quick-action-btn" onclick="clearChat()">Clear</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (message === '') return;

            addMessage(message, 'user');
            messageInput.value = '';

            // Show typing indicator
            typingIndicator.style.display = 'flex';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Send to Flask backend
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';
                addMessage(data.answer, 'bot');

            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage('Sorry, something went wrong. Please try again!', 'bot');
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');

            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            messageDiv.innerHTML = `
                <div class="message-content">
                    <p>${text}</p>
                </div>
                <span class="message-time">${timeString}</span>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendQuickMessage(message) {
            messageInput.value = message;
            sendMessage();
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            addMessage('Chat cleared! Ask me anything 😊', 'bot');
        }
    </script>
</body>
</html>
